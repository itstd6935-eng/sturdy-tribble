<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدرسة ذات العماد</title>
  <style>
    :root {
      --blue-dark: #0D47A1;
      --blue-darker: #0A3579;
      --white: #FFFFFF;
      --gold: #FFD54F;
      --gray-light: #F5F5F5;
      --text-dark: #333333;
    }* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
body { background-color: var(--gray-light); color: var(--text-dark); }

header {
  background-color: var(--blue-dark);
  color: var(--white);
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 1000;
}

header h1 { font-size: 1.5rem; color: var(--gold); }
nav ul { list-style: none; display: flex; gap: 1.5rem; }
nav a { text-decoration: none; color: var(--white); font-weight: 500; transition: color 0.3s; }
nav a:hover { color: var(--gold); }

.hero {
  background: linear-gradient(rgba(13,71,161,0.8), rgba(13,71,161,0.8)), url('https://images.unsplash.com/photo-1603325209237-96d7e57cf43b?auto=format&fit=crop&w=1500&q=80') center/cover;
  color: var(--white); text-align: center; padding: 5rem 1rem;
}

.hero h2 { font-size: 2.5rem; margin-bottom: 1rem; }
.hero p { font-size: 1.2rem; margin-bottom: 2rem; }
.hero button { background-color: var(--gold); border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 8px; cursor: pointer; margin: 0 0.5rem; transition: background-color 0.3s; }
.hero button:hover { background-color: #ffce2a; }

section { padding: 4rem 2rem; text-align: center; }
section h3 { color: var(--blue-dark); margin-bottom: 2rem; font-size: 2rem; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; justify-items: center; }
.card { background-color: var(--white); border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 1.5rem; transition: transform 0.3s; }
.card:hover { transform: translateY(-5px); }
.news-item img { width: 100%; border-radius: 10px; }

footer { background-color: var(--blue-darker); color: var(--white); text-align: center; padding: 1.5rem 1rem; margin-top: 3rem; }
footer p { color: var(--gray-light); }

  </style>
</head>
<body>
  <header>
    <h1>مدرسة ذات العماد</h1>
    <nav>
      <ul>
        <li><a href="#">الرئيسية</a></li>
        <li><a href="#about">عن المدرسة</a></li>
        <li><a href="#subjects">الأقسام</a></li>
        <li><a href="#news">الأخبار</a></li>
        <li><a href="#contact">تواصل معنا</a></li>
      </ul>
    </nav>
  </header>  <section class="hero">
    <h2>نصنع جيل المستقبل بالعلم والمعرفة</h2>
    <p>مدرسة ذات العماد تهدف إلى تطوير مهارات الطلاب وبناء عقول مبدعة ومستنيرة.</p>
    <button>اعرف أكثر</button>
    <button>تواصل معنا</button>
  </section>  <section id="about">
    <h3>عن المدرسة</h3>
    <p>مدرسة ذات العماد هي مؤسسة تعليمية رائدة تسعى لبناء جيل واعٍ ومبدع يجمع بين العلم والقيم والأخلاق. توفر بيئة تعليمية متطورة تحفّز التفكير والابتكار وتهتم بالأنشطة اللامنهجية التي تنمّي مهارات الطلاب الحياتية والاجتماعية.</p>
  </section>  <section id="subjects">
    <h3>الأقسام والمواد</h3>
    <div class="cards">
      <div class="card">العلوم</div>
      <div class="card">الرياضيات</div>
      <div class="card">اللغات</div>
      <div class="card">التقنية</div>
    </div>
  </section>  <section id="news">
    <h3>الأخبار والأنشطة</h3>
    <div class="cards">
      <div class="card news-item">
        <img src="https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=800&q=60" alt="نشاط 1">
        <p>زيارة علمية إلى متحف العلوم.</p>
      </div>
      <div class="card news-item">
        <img src="https://images.unsplash.com/photo-1596496056270-7b7c8d5a6a1a?auto=format&fit=crop&w=800&q=60" alt="نشاط 2">
        <p>مسابقة البرمجة للطلاب المتفوقين.</p>
      </div>
    </div>
  </section>  <section id="contact">
    <h3>تواصل معنا</h3>
    <p>العنوان: جيبوتي<br>
    الهاتف: +253 XXX XXXX<br>
    البريد الإلكتروني: info@zatalimad.edu.dj</p>
  </section>  <footer>
    <p>© 2025 مدرسة ذات العماد. جميع الحقوق محفوظة.</p>
  </footer>  <script>
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        alert('سيتم تحويلك إلى الصفحة المطلوبة قريبًا ✨');
      });
    });
  </script></body>
</html>
